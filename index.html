<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arya M | Mathematics and Computer Science @ UCSD</title>
    
    <!-- Little icon for the browser tab -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <!-- Tailwind CSS - this framework is a lifesaver -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome for all the cool icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Typed.js library for the typing animation -->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    
    <!-- My custom styles on top of Tailwind -->
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Setting up Tailwind colors -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6', // Purple accent
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white">
    <!-- Navigation bar goes here -->
    <div id="header"></div>
    
    <!-- Main landing section with my photo and typing animation -->
    <div id="hero"></div>
    
    <!-- About me section -->
    <div id="about"></div>
    
    <!-- My projects section (the important stuff) -->
    <div id="projects"></div>
    
    <!-- Skills I've learned -->
    <div id="skills"></div>
    
    <!-- How to reach me -->
    <div id="contact"></div>
    
    <!-- Random photos -->
    <div id="gallery"></div>
    
    <!-- Bottom of the page -->
    <div id="footer"></div>
    
    <!-- All the JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
