<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arya Mohammadi | Mathematics & Computer Science @ UCSD | Technical Lead</title>
    <meta name="description" content="Arya Mohammadi - Mathematics & Computer Science student at UC San Diego. Full-stack developer building production-ready applications with Node.js, Express, MongoDB, and React.">
    <meta name="keywords" content="Arya Mohammadi, UCSD, Computer Science, Mathematics, Technical Lead, Full-Stack Developer, React, Node.js, Python, C++, Software Engineer">
    <meta name="author" content="Arya Mohammadi">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Arya Mohammadi | Technical Lead & Full-Stack Developer">
    <meta property="og:description" content="Mathematics & Computer Science student at UC San Diego. Building full-stack web applications with Node.js, Express, MongoDB, and React.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aryamohammadi.github.io">
    <meta property="og:image" content="https://aryamohammadi.github.io/images/IMG_72.png">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Arya Mohammadi | Technical Lead & Full-Stack Developer">
    <meta name="twitter:description" content="Mathematics & Computer Science student at UC San Diego. Full-stack developer building production-ready applications.">
    <meta name="twitter:image" content="https://aryamohammadi.github.io/images/IMG_72.png">
    
    <!-- Little icon for the browser tab -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <!-- Tailwind CSS - this framework is a lifesaver -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome for all the cool icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Typed.js library for the typing animation -->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    
    <!-- My custom styles on top of Tailwind -->
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Setting up Tailwind colors -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6', // Purple accent
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white overflow-x-hidden">
    <!-- Premium Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 flex items-center justify-center z-50">
        <!-- Animated Background -->
        <div class="absolute inset-0 overflow-hidden">
            <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-purple-600/20 rounded-full blur-3xl animate-pulse"></div>
            <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
            <div class="absolute top-1/2 left-1/2 w-32 h-32 bg-pink-600/30 rounded-full blur-2xl animate-pulse" style="animation-delay: 2s;"></div>
        </div>
        
        <!-- Main Loading Content -->
        <div class="text-center relative z-10">
            <!-- Animated Logo/Initial -->
            <div class="mb-8">
                <div class="w-24 h-24 mx-auto border-4 border-transparent bg-gradient-to-r from-purple-500 to-pink-500 rounded-full flex items-center justify-center text-3xl font-bold animate-spin-slow relative">
                    <div class="absolute inset-1 bg-gray-900 rounded-full flex items-center justify-center">
                        <span class="bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">A</span>
                    </div>
                </div>
            </div>
            
            <!-- Animated Text -->
            <div class="mb-6">
                <h1 class="text-3xl font-light mb-2 bg-gradient-to-r from-white via-purple-200 to-white bg-clip-text text-transparent animate-pulse">
                    Arya Mohammadi
                </h1>
                <div id="loading-text" class="text-lg text-gray-300 font-light">
                    Initializing Portfolio...
                </div>
            </div>
            
            <!-- Advanced Progress Bar -->
            <div class="w-80 mx-auto">
                <div class="bg-gray-800/50 rounded-full h-3 backdrop-blur-sm border border-gray-700/50">
                    <div id="loading-progress" class="bg-gradient-to-r from-purple-500 via-pink-500 to-purple-600 h-full rounded-full transition-all duration-500 ease-out relative overflow-hidden" style="width: 0%">
                        <div class="absolute inset-0 bg-white/20 animate-shimmer"></div>
                    </div>
                </div>
                <div id="loading-percentage" class="text-sm text-gray-400 mt-2 font-mono">0%</div>
            </div>
            
            <!-- Loading Steps -->
            <div class="mt-8 text-sm text-gray-400 space-y-1">
                <div id="loading-step" class="opacity-60">Loading components...</div>
            </div>
        </div>
    </div>

    <!-- Navigation bar goes here -->
    <div id="header"></div>
    
    <!-- Main landing section with my photo and typing animation -->
    <div id="hero"></div>
    
    <!-- About me section -->
    <div id="about"></div>
    
    <!-- My projects section (the important stuff) -->
    <div id="projects"></div>
    
    <!-- Skills I've learned -->
    <div id="skills"></div>
    
    <!-- How to reach me -->
    <div id="contact"></div>
    
    <!-- Random photos -->
    <div id="gallery"></div>
    
    <!-- Bottom of the page -->
    <div id="footer"></div>
    
    <!-- All the JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
