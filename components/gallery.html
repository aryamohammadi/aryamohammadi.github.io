<section id="gallery" class="py-12 sm:py-16 bg-[#0d1117]">
    <div class="container mx-auto px-6">
        <!-- Section header -->
        <div class="text-center mb-12 sm:mb-16">
            <h2 class="section-title text-3xl sm:text-4xl md:text-5xl font-light mb-4 gradient-text tracking-tight inline-block">Gallery</h2>
            <p class="text-base sm:text-lg text-[#8b949e] font-light max-w-2xl mx-auto mt-4">
                Moments captured
            </p>
        </div>
        
        <!-- Elegant divider -->
        <div class="divider mb-12"></div>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 mb-16">
            <div class="overflow-hidden rounded-xl border border-[#30363d] bg-[#161b22] transition-all duration-500">
                <div class="aspect-w-4 aspect-h-3 h-48 sm:h-56 relative">
                    <img class="object-cover w-full h-full transition-transform duration-700" src="images/IMG_1465.jpeg" alt="Gallery photo" loading="lazy" decoding="async" width="400" height="300">
                </div>
            </div>
            
            <div class="overflow-hidden rounded-xl border border-[#30363d] bg-[#161b22] transition-all duration-500">
                <div class="aspect-w-4 aspect-h-3 h-48 sm:h-56 relative">
                    <img class="object-cover w-full h-full transition-transform duration-700" src="images/FullSizeRender.jpeg" alt="Gallery photo" loading="lazy" decoding="async" width="400" height="300">
                </div>
            </div>
            
            <div class="overflow-hidden rounded-xl border border-[#30363d] bg-[#161b22] transition-all duration-500">
                <div class="aspect-w-4 aspect-h-3 h-48 sm:h-56 relative">
                    <img class="object-cover w-full h-full transition-transform duration-700" src="images/50BD71A7-39DF-44DF-951D-EBA50E62ABED_1_105_c.jpeg" alt="Gallery photo" loading="lazy" decoding="async" width="400" height="300">
                </div>
            </div>
            
            <div class="overflow-hidden rounded-xl border border-[#30363d] bg-[#161b22] transition-all duration-500">
                <div class="aspect-w-4 aspect-h-3 h-48 sm:h-56 relative">
                    <img class="object-cover w-full h-full transition-transform duration-700" src="images/IMG_7143.jpeg" alt="Gallery photo" loading="lazy" decoding="async" width="400" height="300">
                </div>
            </div>
        </div>
        
        <!-- Elegant quote -->
        <div class="text-center max-w-3xl mx-auto">
            <blockquote class="text-[#c9d1d9] italic text-base font-light leading-relaxed">
                <p class="mb-3">"Everything we hear is an opinion, not a fact. Everything we see is a perspective, not the truth."</p>
                <footer class="text-[#8b949e] text-sm font-normal not-italic">
                    ― Marcus Aurelius, <cite class="font-medium">Meditations</cite>
                </footer>
            </blockquote>
        </div>
    </div>
</section>
